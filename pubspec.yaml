name: internal_chat
description: "Secure internal chat application"
publish_to: 'none'
version: 1.0.0+1

environment:
  # matrix 14 needs Dart 3.11; flutter_vodozemac 0.8 needs Flutter 3.38.
  sdk: '>=3.11.0 <4.0.0'
  flutter: '>=3.38.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  get: ^4.6.6
  get_storage: ^2.1.1
  file_picker: ^8.0.3
  path_provider: ^2.1.3
  flutter_secure_storage: ^9.0.0
  uuid: ^4.4.0
  intl: ^0.20.2
  connectivity_plus: ^6.0.3
  mime: ^1.0.5
  permission_handler: ^11.3.1
  http: ^1.2.2
  record: ^7.1.1
  audioplayers: ^6.1.0
  # Matrix SDK + E2EE. Both are AGPL-3.0: accepted for the POC only, legal
  # review pending (see README "Licence"). Only lib/data/matrix/ imports them.
  # Keep flutter_vodozemac on 0.8.x until matrix depends on vodozemac 0.9.
  matrix: ^14.1.0
  flutter_vodozemac: ^0.8.1
  # Opens the SDK store through package:sqlite3, built as SQLCipher below.
  sqflite_common_ffi: ^2.4.4
  path: ^1.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

# The local Matrix store (messages, room keys, tokens) must be encrypted at
# rest, so package:sqlite3 links SQLCipher instead of plain SQLite. The app
# refuses to start if SQLCipher is not available.
hooks:
  user_defines:
    sqlite3:
      source: sqlcipher

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/images/
    - assets/icons/
