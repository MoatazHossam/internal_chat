name: internal_chat
description: "Secure internal chat application"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'
  flutter: '>=3.22.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  get: ^4.6.6
  get_storage: ^2.1.1
  file_picker: ^8.0.3
  path_provider: ^2.1.3
  flutter_secure_storage: ^9.0.0
  uuid: ^4.4.0
  intl: ^0.19.0
  connectivity_plus: ^6.0.3
  mime: ^1.0.5
  permission_handler: ^11.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
